version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node major we run (24, see .nvmrc); bump it together with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript and ESLint majors wait until typescript-eslint / Next's lint plugins support them
      # (scripts/check-toolchain.mjs). PR #2 (TS 7 + ESLint 10) broke the blog's typecheck.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        update-types: ["minor", "patch"]
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tooling:
        update-types: ["minor", "patch"]
        patterns:
          [
            "*eslint*",
            "prettier*",
            "typescript",
            "vitest",
            "@playwright/*",
            "turbo",
            "@changesets/*",
            "lefthook",
            "@commitlint/*",
          ]
      content:
        update-types: ["minor", "patch"]
        patterns: ["unified", "remark-*", "rehype-*", "@shikijs/*", "mermaid", "hast-*", "unist-*", "yaml", "zod"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
