name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LEFTHOOK: 0 # git hooks are for humans/agents; CI runs the same checks itself
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Hermes works on branches named hermes/*. Those PRs may only touch article content.
  content-guard:
    name: Content guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Hermes branches may only change apps/blog/content/
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$HEAD_REF" in hermes/*) ;; *) echo "Not a Hermes branch: skipped."; exit 0 ;; esac
          bad=$(git diff --name-only "$BASE_SHA"...HEAD | grep -v '^apps/blog/content/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Hermes branches may only change apps/blog/content/. Outside files:"; echo "$bad"; exit 1
          fi
          echo "OK: content-only change."

  # Code changes need a changeset (it bumps package.json versions and writes the CHANGELOG).
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'hermes/') && !startsWith(github.head_ref, 'changeset-release/') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changeset when apps or packages change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          code=$(echo "$files" | grep -E '^(apps|packages)/' | grep -vE '^apps/blog/content/|\.(test|spec)\.|/e2e/|CHANGELOG\.md$' || true)
          [ -z "$code" ] && { echo "No app/package code changed."; exit 0; }
          echo "$files" | grep -E '^\.changeset/.+\.md$' | grep -qv 'README.md' && { echo "Changeset found."; exit 0; }
          echo "::error::Code changed without a changeset. Run 'pnpm changeset' (patch/minor/major) and commit the file."; exit 1

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --cache-dir=.turbo/cache
      - name: Install Playwright Chromium
        run: pnpm --filter @troules/index exec playwright install --with-deps chromium
      - name: End-to-end + accessibility (axe)
        run: pnpm turbo run e2e --cache-dir=.turbo/cache
      - name: Lighthouse budgets
        run: pnpm lighthouse
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            apps/*/playwright-report/
            .lighthouseci/
          retention-days: 7
          include-hidden-files: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-3.0
