name: Release

# Versions are bumped inside each PR (`pnpm changeset` + `pnpm version-packages`), so main only ever receives reviewed,
# CI-green commits and the ruleset needs no bypass (ADR 0005). After a merge this job tags every package version that
# has no tag yet (`@troules/blog@0.3.0`, …). Tags aren't covered by the branch ruleset. Vercel deploys on its own.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

env:
  LEFTHOOK: 0

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Tag new package versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm changeset tag
          git push origin --tags
