name: Release

# After a merge to main: if changesets are pending, bump each package.json version, write CHANGELOG.md files,
# and commit that straight to main as github-actions[bot] (the only ruleset bypass actor; see docs/adr/0005).
# Why not the usual "Version packages" PR: PRs opened with GITHUB_TOKEN don't trigger CI, so required checks
# would never run on it. Deploys themselves are done by Vercel's Git integration.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Apply pending changesets
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then echo "No pending changesets."; exit 0; fi
          pnpm changeset version
          pnpm install --lockfile-only
          pnpm exec prettier --write "**/CHANGELOG.md" "**/package.json" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          versions=$(git diff --cached --name-only -- '*/package.json' | xargs -r -I{} node -p "const p=require('./{}');p.name+'@'+p.version" | paste -sd ' ')
          git commit -m "chore(release): ${versions}"
          git push
