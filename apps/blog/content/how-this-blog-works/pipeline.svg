<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="760" height="140" font-family="system-ui, sans-serif" font-size="15">
  <title>Telegram to Hermes to pull request to preview to publish</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b7fd6"/></marker>
  </defs>
  <rect width="760" height="140" rx="14" fill="#f4f1fb"/>
  <g fill="#fff" stroke="#8b7fd6" stroke-width="1.5">
    <rect x="20" y="45" width="120" height="50" rx="10"/>
    <rect x="170" y="45" width="120" height="50" rx="10"/>
    <rect x="320" y="45" width="120" height="50" rx="10"/>
    <rect x="470" y="45" width="120" height="50" rx="10"/>
    <rect x="620" y="45" width="120" height="50" rx="10" fill="#6d3fd1"/>
  </g>
  <g text-anchor="middle" fill="#1c1a22">
    <text x="80" y="75">Telegram</text>
    <text x="230" y="75">Hermes</text>
    <text x="380" y="75">Pull request</text>
    <text x="530" y="75">Preview</text>
    <text x="680" y="75" fill="#fff">Publish</text>
  </g>
  <g stroke="#8b7fd6" stroke-width="2" marker-end="url(#a)">
    <line x1="140" y1="70" x2="168" y2="70"/>
    <line x1="290" y1="70" x2="318" y2="70"/>
    <line x1="440" y1="70" x2="468" y2="70"/>
    <line x1="590" y1="70" x2="618" y2="70"/>
  </g>
</svg>
